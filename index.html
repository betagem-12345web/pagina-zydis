<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZYDRIS HP | Tienda</title>
<style>
:root{--bg:#100d18;--panel:#1c1728;--line:#342844;--purple:#9b5cff;--orange:#ff8b35;--muted:#b9aec9}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#29163b,#100d18 48%);color:#fff;font:15px Arial,sans-serif}
header{padding:20px 16px;text-align:center;border-bottom:1px solid var(--line)}h1{margin:0;color:#c69aff;letter-spacing:2px}header p{color:var(--muted);margin:7px 0 0}
main{max-width:760px;margin:22px auto;padding:0 14px}.card{background:#1c1728;border:1px solid #39294d;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #0005}
h2{margin:0 0 14px;color:#d7baff;font-size:20px}.muted{color:var(--muted)}input,select,button,textarea{font:inherit;border-radius:10px;padding:12px;border:1px solid #4b3b60;background:#100d18;color:white;width:100%;margin:6px 0}
button{background:linear-gradient(90deg,#8c45e9,#ff8738);border:0;font-weight:bold;cursor:pointer}button.secondary{background:#342544}button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.pkg{border:1px solid #49335f;background:#15111e;border-radius:13px;padding:14px}.pkg b{display:block;font-size:18px}.pkg span{color:#ffad69}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.hidden{display:none!important}.status{padding:9px;border-radius:9px;background:#282035;color:#ffd29c}.msg{padding:9px;margin:7px 0;border-radius:10px;background:#2a2238;overflow-wrap:anywhere}.mine{border:1px solid #8650bd}.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>ZYDRIS HP</h1><p>Tu tienda gamer de diamantes</p></header>
<main>
<section id="auth" class="card">
<h2>Ingresá a tu cuenta</h2><p class="muted">Registrate o iniciá sesión para ver los paquetes.</p>
<input id="email" type="email" placeholder="Tu correo">
<input id="password" type="password" placeholder="Contraseña">
<div class="row"><button id="login">Iniciar sesión</button><button id="register" class="secondary">Registrarme</button></div>
<p id="authmsg" class="small"></p>
</section>
<section id="shop" class="hidden">
<div class="card row"><div><b id="welcome">Hola</b><div class="small">Sesión iniciada</div></div><button id="logout" class="secondary">Cerrar sesión</button></div>
<div class="card"><h2>Elegí tu región</h2><select id="region"><option>LATAM</option><option>Brasil</option><option>Estados Unidos</option><option>Otra</option></select>
<h2>Paquetes</h2><div class="grid" id="packages"></div></div>
<div class="card"><h2>Mis pedidos</h2><div id="orders" class="muted">Todavía no tenés pedidos.</div></div>
<div class="card"><h2>Soporte</h2><div id="support" class="status">Consultando disponibilidad…</div><div id="chat"></div><textarea id="message" rows="2" placeholder="Escribí tu mensaje…"></textarea><button id="send">Enviar mensaje</button><p class="small">No envíes contraseñas ni datos de pago por el chat.</p></div>
</section>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const URL='https://sljxvffppvhbfralcclx.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsanh2ZmZwcHZoYmZyYWxjY2x4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MzM5MzYsImV4cCI6MjExMDUwOTkzNn0.CJ8pxJkAzHo9czDW6DMgaVhO2EbPu0SGaKjCiBL-Dnc';
const db=createClient(URL,KEY);
const $=id=>document.getElementById(id);
const packages=[['100 diamantes','Paquete de prueba'],['310 diamantes','Paquete de prueba'],['520 diamantes','Paquete de prueba'],['1060 diamantes','Paquete de prueba'],['2180 diamantes','Paquete de prueba'],['5600 diamantes','Paquete de prueba']];
let user=null;
function say(t){$('authmsg').textContent=t}
async function enter(u){user=u;$('auth').classList.add('hidden');$('shop').classList.remove('hidden');$('welcome').textContent='Hola, '+(u.email||'cliente');await loadOrders();await loadChat();await loadSupport();subscribe()}
$('login').onclick=async()=>{let {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)say(error.message);else enter(data.user)};
$('register').onclick=async()=>{let {data,error}=await db.auth.signUp({email:$('email').value,password:$('password').value});if(error)say(error.message);else if(data.session)enter(data.user);else say('Cuenta creada. Iniciá sesión para continuar.')};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('packages').innerHTML=packages.map((p,i)=>`<div class="pkg"><b>${p[0]}</b><span>Consultar precio</span><button data-i="${i}">Pedir</button></div>`).join('');
$('packages').onclick=async e=>{let b=e.target.closest('button');if(!b)return;let i=+b.dataset.i;let code='ZH-'+Math.random().toString(36).slice(2,8).toUpperCase();let {error}=await db.from('orders').insert({order_code:code,customer_name:user.email,package_name:packages[i][0],region:$('region').value,user_id:user.id});if(error)alert('No se pudo crear el pedido: '+error.message);else{alert('Pedido creado. Tu código es '+code);loadOrders()}};
async function loadOrders(){let {data,error}=await db.from('orders').select('order_code,package_name,region,payment_status,delivery_status,created_at').eq('user_id',user.id).order('created_at',{ascending:false});$('orders').innerHTML=error?error.message:(data?.length?data.map(o=>`<div class="msg"><b>${o.order_code}</b> · ${o.package_name}<br>Región: ${o.region}<br>Pago: ${o.payment_status} · Entrega: ${o.delivery_status}</div>`).join(''):'Todavía no tenés pedidos.')}
async function loadChat(){let {data,error}=await db.from('messages').select('message,sender,created_at').eq('user_id',user.id).order('created_at');$('chat').innerHTML=error?`<p class="small">${error.message}</p>`:(data||[]).map(m=>`<div class="msg ${m.sender==='customer'?'mine':''}"><b>${m.sender==='admin'?'Soporte':'Vos'}:</b> ${esc(m.message)}</div>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('send').onclick=async()=>{let message=$('message').value.trim();if(!message)return;let {error}=await db.from('messages').insert({customer_name:user.email,message,sender:'customer',user_id:user.id});if(error)alert(error.message);else{$('message').value='';loadChat()}};
async function loadSupport(){let {data}=await db.from('support_status').select('is_online').eq('id',1).maybeSingle();$('support').textContent=data?.is_online?'🟢 Soporte en línea':'🟡 Soporte no disponible';}
function subscribe(){db.channel('customer-live').on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:`user_id=eq.${user.id}`},loadOrders).on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:`user_id=eq.${user.id}`},loadChat).on('postgres_changes',{event:'*',schema:'public',table:'support_status'},loadSupport).subscribe()}
let {data:{user:existing}}=await db.auth.getUser();if(existing)await enter(existing);
</script>
</body></html>
